<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Employees{% endblock %} | People</title>
<style>
:root{color-scheme:light;--ink:#202a29;--muted:#727d79;--line:#e3e9e6;--green:#147d60}
*{box-sizing:border-box}body{margin:0;background:#f6f8f7;color:var(--ink);font:14px/1.6 'Segoe UI',Arial,sans-serif;letter-spacing:0}a{color:var(--green);text-decoration:none}button,input,select{font:inherit}:focus-visible{outline:3px solid #83cfb7;outline-offset:3px}
.topbar{background:white;border-bottom:1px solid var(--line)}.nav{max-width:1200px;margin:auto;min-height:76px;padding:16px 32px;display:flex;align-items:center;gap:36px}.brand{color:var(--ink);font-size:22px;font-weight:750;display:flex;align-items:center;gap:10px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;background:var(--green);color:white;border-radius:8px;font-size:19px}.nav-link{color:#4f5e58;font-weight:600}.workspace{margin-left:auto;color:var(--muted);font-size:12px}
main{max-width:1136px;margin:0 auto;padding:40px 0 64px}.breadcrumb{color:var(--muted);font-size:12px;margin:0 0 22px}.page-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}h1{font-size:30px;line-height:1.25;margin:0 0 8px;font-weight:650;overflow-wrap:anywhere}h2{font-size:17px;margin:0 0 6px;font-weight:650}p{margin:0}.muted{color:var(--muted)}
.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 18px;border:1px solid transparent;border-radius:6px;font-weight:600;cursor:pointer;text-align:center}.primary{background:var(--green);color:white}.primary:hover{background:#10644d}.secondary{background:white;color:#485950;border-color:#d6dfda}.secondary:hover{background:#f0f5f2}
.toolbar{display:flex;align-items:end;gap:14px;padding:20px 0;border-top:1px solid var(--line)}.search{flex:1;max-width:360px}label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}input,select{width:100%;min-height:44px;padding:10px 12px;border:1px solid #d8e0dc;border-radius:6px;background:white;color:var(--ink)}input:focus,select:focus{border-color:var(--green);outline:3px solid #147d6018}input::placeholder{color:#929c97}.filter{width:210px}.count{margin-left:auto;align-self:center;color:var(--muted);font-size:12px}
.table-wrap{width:100%;overflow-x:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:white}table{border-collapse:collapse;width:100%;text-align:left}th{background:#f0f4f2;font-size:11px;color:#64736c;font-weight:650;text-transform:uppercase;padding:14px 22px;white-space:nowrap}td{padding:18px 22px;border-top:1px solid #edf0ee}tr:hover td{background:#fafcfb}.person{display:flex;align-items:center;gap:12px;min-width:170px}.avatar{width:38px;height:38px;flex-shrink:0;display:grid;place-items:center;background:#e1eee8;color:#39745c;border-radius:50%;font-weight:650}tr:nth-child(3n+2) .avatar{background:#f4e6ed;color:#9b5574}tr:nth-child(3n) .avatar{background:#e9e8f1;color:#73618b}.person-name{font-weight:600;overflow-wrap:anywhere}.email{color:#6b7972;overflow-wrap:anywhere}.position{display:inline-block;background:#f0f3f1;padding:3px 9px;border-radius:4px;font-size:12px;overflow-wrap:anywhere}.date{white-space:nowrap;color:#6b7972;font-size:13px}
.empty{text-align:center;padding:64px 20px}.empty p{margin:8px 0 22px;color:var(--muted)}.form-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:64px;border-top:1px solid var(--line);padding-top:30px}.aside-note{margin-top:24px;padding-left:14px;border-left:3px solid #9bcbb9;color:var(--muted);font-size:13px}.employee-form{max-width:580px}.field{margin-bottom:25px}.field input{min-height:48px}.errorlist{color:#b13c43;padding-left:18px;font-size:13px;margin:6px 0}.has-error input{border-color:#c5666b}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:32px;padding-top:22px;border-top:1px solid var(--line)}.required{color:#b75b64}.notice{padding:12px 16px;background:#e5f2eb;border-left:3px solid var(--green);margin-bottom:24px}[hidden]{display:none!important}
@media(max-width:1200px){main{margin:0 32px}}@media(max-width:640px){.nav{padding:14px 20px;gap:24px;min-height:68px}.workspace{display:none}main{margin:0 20px;padding-top:28px}h1{font-size:26px}.page-heading{align-items:start;flex-direction:column;gap:16px}.toolbar{flex-wrap:wrap}.search{max-width:none;flex-basis:100%}.filter{flex:1}.form-layout{grid-template-columns:minmax(0,1fr);gap:28px}.aside-note{margin-top:14px}th,td{padding:14px 16px}.form-actions .button{flex:1}}
</style>
</head>
<body>
<header class="topbar"><nav class="nav" aria-label="Main navigation">
<a class="brand" href="{% url 'employee-list-view' %}"><span class="brand-mark" aria-hidden="true">P</span>People.</a>
<a class="nav-link" href="{% url 'employee-list-view' %}">Employees</a><span class="workspace">CD CDI / Workspace</span>
</nav></header>
<main>
{% if messages %}{% for message in messages %}<div class="notice" role="status">{{ message }}</div>{% endfor %}{% endif %}
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
